app = "ripar-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4021"
  RIPAR_NETWORK = "testnet"
  # RIPAR_PAY_TO is NOT set here on purpose: set it with `fly secrets set`.
  # A default payout address would silently settle to someone else.

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # An idle paid endpoint should cost nothing to keep listed.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
