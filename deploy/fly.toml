# fly.toml — https://fly.io.  fly launch --no-deploy, then:
#   fly secrets set RIPAR_PAY_TO=<your Algorand address>
app = "ripar-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RIPAR_NETWORK = "testnet"
  PORT = "4021"

[http_service]
  internal_port = 4021
  force_https = true
  # NOT zero. An agent scaled to zero misses the settlement webhook for a call
  # that already completed, and cold-starts into the next caller's 402.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"
