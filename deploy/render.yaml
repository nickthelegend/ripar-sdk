# render.yaml — https://render.com
services:
  - type: web
    name: ripar-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # sync: false means Render prompts rather than inventing one. Settlement
      # goes straight to this address, so a wrong value pays a stranger.
      - key: RIPAR_PAY_TO
        sync: false
      - key: RIPAR_NETWORK
        value: testnet
